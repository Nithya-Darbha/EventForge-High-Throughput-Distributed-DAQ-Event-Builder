# frontend 1 gets SIGKILLed at t=2s and restarted at t=3.5s
# compare normal mode (events wait for it -> time out) vs degraded mode
name: producer_failure
builder:
  sources: 4
  rate: 5000
  duration_s: 6
  credits: 256
  timeout_ms: 100
  sample_ms: 50
frontend:
  payload_min: 4096
  payload_max: 4096
  policy: block
events:
  - {at_s: 2.0, kill: 1}
  - {at_s: 3.5, restart: 1}
sweep:
  builder.degraded: [false, true]
