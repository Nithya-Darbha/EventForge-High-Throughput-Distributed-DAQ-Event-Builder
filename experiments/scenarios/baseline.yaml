# sanity run: everything well below capacity, every event should come out complete
name: baseline
builder:
  sources: 4
  rate: 10000          # triggers/s
  duration_s: 5
  credits: 256         # max frags in flight per source
  shards: 2
  sinks: 2
  timeout_ms: 100
  verify: true         # sink checks every payload byte
frontend:
  payload_min: 4096
  payload_max: 4096
  policy: block
